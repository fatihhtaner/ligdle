# main'e her gönderimde ve her gece testleri çalıştırır, siteyi derler ve GitHub Pages'e yükler.
# Gece derlemesi arşive dünün oyuncusunu ekler (src/content/render.ts).
# Repo ayarlarında Pages > Source = "GitHub Actions" olmalı.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 21 * * *" # Türkiye saatiyle 00:05
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
